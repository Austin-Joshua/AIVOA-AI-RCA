[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    live_provider: tests that make real external calls to live Groq API (opt-in via --run-live or -m live_provider)
filterwarnings =
    # Third-party library deprecation filters:
    # 1. Pydantic V2 migration warnings originating from schema extra definitions and config classes
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    # 2. Python 3.12 utcnow deprecation from third-party SQLAlchemy column defaults and dependencies
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
